name: Configurar .env IT no VPS2

on:
  workflow_dispatch:
    inputs:
      stream_key:
        description: 'STREAM_KEY_H_IT (deixe vazio para manter atual ou definir depois)'
        required: false

jobs:
  configurar-env:
    name: Escreve chaves Gemini no .env IT do VPS2
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH for VPS2
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_VPS_IT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 169.58.220.233 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy google_credentials_it.json no VPS2
        env:
          GCP_JSON: ${{ secrets.GOOGLE_CREDENTIALS_IT }}
        run: |
          printf '%s' "$GCP_JSON" | ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@169.58.220.233 \
            "cat > /root/ao_vivo_it/google_credentials_it.json && echo 'google_credentials_it.json OK'"

      - name: Escrever variaveis no .env IT
        env:
          K_CONTENT_1: ${{ secrets.GEMINI_KEY_LIVE_CONTENT_1_IT }}
          K_CONTENT_2: ${{ secrets.GEMINI_KEY_LIVE_CONTENT_2_IT }}
          K_CHAT_1: ${{ secrets.GEMINI_KEY_LIVE_CHAT_1_IT }}
          K_CHAT_2: ${{ secrets.GEMINI_KEY_LIVE_CHAT_2_IT }}
          K_CHAT_3: ${{ secrets.GEMINI_KEY_LIVE_CHAT_3_IT }}
          STREAM_KEY: ${{ github.event.inputs.stream_key }}
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@169.58.220.233 \
            K_CONTENT_1="$K_CONTENT_1" K_CONTENT_2="$K_CONTENT_2" \
            K_CHAT_1="$K_CHAT_1" K_CHAT_2="$K_CHAT_2" K_CHAT_3="$K_CHAT_3" \
            STREAM_KEY="$STREAM_KEY" bash << 'ENDSSH'
          set -e
          ENV_FILE=/root/ao_vivo_it/.env
          touch "$ENV_FILE"
          update_var() {
            local key=$1 val=$2
            if grep -q "^${key}=" "$ENV_FILE" 2>/dev/null; then
              sed -i "s|^${key}=.*|${key}=${val}|" "$ENV_FILE"
            else
              echo "${key}=${val}" >> "$ENV_FILE"
            fi
          }
          update_var GEMINI_KEY_LIVE_CONTENT_1_IT "$K_CONTENT_1"
          update_var GEMINI_KEY_LIVE_CONTENT_2_IT "$K_CONTENT_2"
          update_var GEMINI_KEY_LIVE_CHAT_1_IT    "$K_CHAT_1"
          update_var GEMINI_KEY_LIVE_CHAT_2_IT    "$K_CHAT_2"
          update_var GEMINI_KEY_LIVE_CHAT_3_IT    "$K_CHAT_3"
          update_var INGEST_URL "rtmp://a.rtmp.youtube.com/live2"
          if [ -n "$STREAM_KEY" ]; then
            update_var STREAM_KEY_H_IT "$STREAM_KEY"
            echo "STREAM_KEY_H_IT configurada"
          else
            if ! grep -q "^STREAM_KEY_H_IT=" "$ENV_FILE" 2>/dev/null; then
              echo "STREAM_KEY_H_IT=" >> "$ENV_FILE"
              echo "STREAM_KEY_H_IT placeholder criado (preencher antes de iniciar servico)"
            else
              echo "STREAM_KEY_H_IT ja existe no .env (mantida)"
            fi
          fi
          echo "--- .env IT atualizado ---"
          grep -v "KEY\|SECRET\|STREAM" "$ENV_FILE" || true
          echo "(chaves sensiveis omitidas do log)"
          ENDSSH

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
