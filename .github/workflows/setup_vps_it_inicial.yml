name: ⚙️ Setup VPS IT Inicial

on:
  workflow_dispatch:

jobs:
  setup:
    name: One-time VPS setup for Canal IT
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH for VPS2
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_VPS_IT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 169.58.220.233 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create directories on VPS2
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@169.58.220.233 \
            "mkdir -p /root/ao_vivo_it/{blocos,suplicas,insumos_h,musicas/manha,musicas/noite,videos_base} && echo 'Directories IT OK'"

      - name: Create venv_it and install dependencies
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@169.58.220.233 bash << 'ENDSSH'
            set -e
            export DEBIAN_FRONTEND=noninteractive
            if ! dpkg -l python3.12-venv 2>/dev/null | grep -q "^ii"; then
              for i in 1 2 3 4 5; do
                apt-get update -qq && apt-get install -y python3.12-venv python3-pip -qq 2>/dev/null && break
                sleep 15
              done
            fi
            python3 -m venv /root/venv_it
            /root/venv_it/bin/pip install --upgrade pip --quiet
            /root/venv_it/bin/pip install --quiet \
              google-genai google-api-python-client google-auth google-auth-oauthlib \
              pytz edge-tts pillow numpy python-dotenv
            /root/venv_it/bin/python3 -c "from google import genai; print('✅ google-genai OK')"
            echo "✅ venv_it criado com dependências"
          ENDSSH

      - name: Copy scripts to VPS2
        run: |
          scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            ao_vivo_it/ao_vivo_it.py \
            root@169.58.220.233:/root/ao_vivo_it/ao_vivo_it.py
          scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            ao_vivo_it/gerar_bloco_live_it.py \
            root@169.58.220.233:/root/ao_vivo_it/gerar_bloco_live_it.py
          scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            ao_vivo_it/gerar_token_it.py \
            root@169.58.220.233:/root/ao_vivo_it/gerar_token_it.py
          scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            ao_vivo_it/ao_vivo_it.service \
            root@169.58.220.233:/root/ao_vivo_it/ao_vivo_it.service

      - name: Install systemd service (enabled but NOT started — awaits OAuth + stream key)
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@169.58.220.233 "
            cp /root/ao_vivo_it/ao_vivo_it.service /etc/systemd/system/ao_vivo_it.service
            systemctl daemon-reload
            systemctl enable ao_vivo_it
            echo 'Service IT installed and enabled (NOT started — awaits OAuth token + stream key + .env)'
          "

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
