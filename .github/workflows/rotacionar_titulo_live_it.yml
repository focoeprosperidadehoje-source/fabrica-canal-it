name: Rotacionar Título Live IT

on:
  schedule:
    - cron: '25 */3 * * *'
  workflow_dispatch:

jobs:
  rotacionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências
        run: pip install google-api-python-client google-auth google-auth-httplib2 pytz --quiet

      - name: Rotacionar título
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_IT }}
          TZ_NAME: Europe/Rome
          TITULOS_JSON: >-
            {"manha":"La Madonna Ti Guarisce ORA — Preghiera in Diretta 24H 🙏","tarde":"La Madonna Apre le Porte Chiuse OGGI — In Diretta 24H 🙏","noite":"La Madonna Ti Protegge ORA — Preghiera in Diretta 24H 🙏","madrugada":"La Madonna Spezza Ogni Catena ORA — In Diretta 24H 🙏"}
        run: python3 scripts/rotacionar_titulo_live.py
