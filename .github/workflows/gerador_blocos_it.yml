name: 4. Gerador Blocos Live (IT → VPS2)

on:
  schedule:
    - cron: '0 3,7,11,15,19,23 * * *'   # 6×/dia, offset 2h do EN
  workflow_dispatch:

jobs:
  gerar_blocos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3'

      - name: Install dependencies
        run: pip install google-genai google-api-python-client google-auth google-auth-oauthlib pytz edge-tts

      - name: Generate audio block
        env:
          GEMINI_KEY_LIVE_CONTENT_1_IT: ${{ secrets.GEMINI_KEY_LIVE_CONTENT_1_IT }}
          GEMINI_KEY_LIVE_CONTENT_2_IT: ${{ secrets.GEMINI_KEY_LIVE_CONTENT_2_IT }}
          YOUTUBE_TOKEN_IT: ${{ secrets.YOUTUBE_TOKEN_IT }}
        run: |
          mkdir -p blocos_it
          python ao_vivo_it/gerar_bloco_live_it.py

      - name: Sync to VPS2
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_VPS_IT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 169.58.220.233 >> ~/.ssh/known_hosts 2>/dev/null
          mkdir -p /root/ao_vivo_it/blocos 2>/dev/null || true
          rsync -avz --timeout=60 \
            -e "ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no" \
            blocos_it/ \
            root@169.58.220.233:/root/ao_vivo_it/blocos/
          rm -f ~/.ssh/vps_key
