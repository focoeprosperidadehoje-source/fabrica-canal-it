name: Gerar URL OAuth IT

on:
  workflow_dispatch:

jobs:
  gerar-url:
    name: Gera URL de autorizacao OAuth para Canal IT
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH for VPS2
        env:
          SSH_KEY: ${{ secrets.SSH_KEY_VPS_IT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H 169.58.220.233 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Escrever credenciais OAuth no .env IT
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@169.58.220.233 << 'ENDSSH'
          set -e
          CID=$(python3 -c "import json; d=json.load(open('/root/ao_vivo_en/youtube_token.json')); print(d.get('client_id',''))")
          CSE=$(python3 -c "import json; d=json.load(open('/root/ao_vivo_en/youtube_token.json')); print(d.get('client_secret',''))")
          if [ -z "$CID" ] || [ -z "$CSE" ]; then echo "ERRO: credenciais vazias"; exit 1; fi
          touch /root/ao_vivo_it/.env
          grep -v "^YT_CLIENT_ID=\|^YT_CLIENT_SECRET=" /root/ao_vivo_it/.env > /tmp/env_it.tmp 2>/dev/null || true
          printf 'YT_CLIENT_ID=%s\nYT_CLIENT_SECRET=%s\n' "$CID" "$CSE" >> /tmp/env_it.tmp
          cp /tmp/env_it.tmp /root/ao_vivo_it/.env
          echo "Credenciais escritas no .env IT"
          ENDSSH

      - name: Gerar URL de autorizacao OAuth
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no root@169.58.220.233 "/root/venv_it/bin/python3 -" << 'PYEOF'
          import os, sys
          sys.path.insert(0, '/root/venv_it/lib/python3.12/site-packages')
          with open('/root/ao_vivo_it/.env') as f:
              for line in f:
                  line = line.strip()
                  if '=' in line and not line.startswith('#'):
                      k, v = line.split('=', 1)
                      os.environ.setdefault(k, v)
          CLIENT_ID     = os.environ.get('YT_CLIENT_ID', '')
          CLIENT_SECRET = os.environ.get('YT_CLIENT_SECRET', '')
          if not CLIENT_ID or not CLIENT_SECRET:
              print("ERRO: credenciais ausentes no .env IT")
              sys.exit(1)
          from google_auth_oauthlib.flow import InstalledAppFlow
          cfg = {"installed": {"client_id": CLIENT_ID, "client_secret": CLIENT_SECRET,
              "redirect_uris": ["http://localhost"],
              "auth_uri": "https://accounts.google.com/o/oauth2/auth",
              "token_uri": "https://oauth2.googleapis.com/token"}}
          flow = InstalledAppFlow.from_client_config(cfg, ["https://www.googleapis.com/auth/youtube"])
          flow.redirect_uri = "http://localhost"
          url, _ = flow.authorization_url(prompt="consent", access_type="offline")
          print()
          print("=" * 60)
          print("CANAL IT - URL DE AUTORIZACAO OAUTH")
          print("=" * 60)
          print(url)
          print("=" * 60)
          print("1. Copie a URL acima e abra no navegador")
          print("2. Login com: canalinteligenciadivinaitalia@gmail.com")
          print("3. Autorize — o browser vai abrir localhost e dar erro (normal)")
          print("4. Copie o codigo 'code=XXX' da BARRA DE ENDERECO do browser")
          print("5. Execute workflow 'Salvar Token IT' com esse codigo")
          print("=" * 60)
          PYEOF

      - name: Remove temporary SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
